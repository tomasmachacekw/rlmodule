[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlmodule"
version = "0.2.0"
description = "Flexible reinforcement learning models instantiators library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
  {name = "Lopatovsky"},
  {email = "lopatovsky@gmail.com"},
]
maintainers = [
  {name = "Lopatovsky"},
]

keywords = ["reinforcement-learning", "machine-learning", "reinforcement", "machine", "learning", "rl", "rl-models", "rl-modules", "models", "modules"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "gym",
  "gymnasium==0.29.0",
  "torch>=1.9",
  "skrl>=2.1",
]

[project.optional-dependencies]

# TODO(ll) only examples should depend on skrl, not the main code.
skrl = [
  "skrl>=2.1",
]

all = [
  "skrl>=2.1",
]

# urls
[project.urls]
"Homepage" = "https://github.com/FabricaAI/rlmodule"
"Documentation" = "https://github.com/FabricaAI/rlmodule"
"Discussions" = "https://github.com/FabricaAI/rlmodule/discussions"
"Bug Reports" = "https://github.com/FabricaAI/rlmodule/issues"
"Say Thanks!" = "https://github.com/lopatovsky"
"Source" = "https://github.com/FabricaAI/rlmodule"

[tool.setuptools.packages.find]
include = ["rlmodule*"]
exclude = ["tests*", "docs*"]

[tool.yapf]
# run: yapf -p -m -i -r <folder>
based_on_style = "pep8"
blank_line_before_nested_class_or_def = false
blank_lines_between_top_level_imports_and_variables = 2
column_limit = 120
join_multiple_lines = false
space_between_ending_comma_and_closing_bracket = false
spaces_around_power_operator = true
split_all_top_level_comma_separated_values = true
split_before_arithmetic_operator = true
split_before_dict_set_generator = false
split_before_dot = true
split_complex_comprehension = true
coalesce_brackets = true


[tool.codespell]
# run: codespell <folder>
skip = "./docs/_build,./docs/source/_static"
quiet-level = 3
count = ""


[tool.isort]
use_parentheses = false
line_length = 120
multi_line_output = 3
lines_after_imports = 2
known_annotation = ["typing"]
known_framework = [
  "torch",
  "numpy",
]
sections = [
  "FUTURE",
  "ANNOTATION",
  "STDLIB",
  "THIRDPARTY",
  "FRAMEWORK",
  "FIRSTPARTY",
  "LOCALFOLDER",
]
no_lines_before = "THIRDPARTY"
skip = ["docs"]


[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (skip with: -m 'not slow')",
]
